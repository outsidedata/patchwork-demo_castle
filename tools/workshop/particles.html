<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Particle workshop</title>
<script type="importmap">
{
  "imports": {
    "three": "/three/build/three.module.js",
    "three/addons/": "/three/examples/jsm/",
    "three/examples/jsm/": "/three/examples/jsm/",
    "#engine/": "/engine/",
    "#plugins/": "/plugins/",
    "#addons/": "/addons/",
    "fflate": "/npm/fflate/esm/browser.js",
    "fzstd": "/npm/fzstd/esm/index.mjs"
  }
}
</script>
<style>
:root { --bg: #111214; --panel: #1a1b1e; --card: #212327; --line: #2c2f35; --text: #e2e4e8; --dim: #8d929b; --accent: #e0a33a; --pick: #4fc3ff }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, system-ui, sans-serif }
.app { display: grid; grid-template-columns: 220px 1fr 420px; grid-template-rows: 52px 1fr; height: 100vh }
header { grid-column: 1 / 4; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line) }
header b { color: var(--accent); font-size: 15px }
button, select, input, textarea { font: inherit; font-size: 13px; color: var(--text) }
button { padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px; background: #26292e; cursor: pointer }
button.go { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600 }
button.small { padding: 3px 8px; font-size: 12px }
button.on { border-color: var(--pick); color: var(--pick) }
button:disabled { opacity: .35; cursor: default }
select, input, textarea { background: #121316; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px }
.sp { flex: 1 }
#status { color: var(--dim); font-size: 13px }
#status.dirty { color: var(--accent) }
nav { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 8px 0 24px }
nav .head { padding: 14px 16px 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim) }
nav .effect { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: none; padding: 8px 16px; color: var(--text) }
nav .effect:hover { background: #24262b }
nav .effect.on { background: #2b2e34; box-shadow: inset 3px 0 var(--accent); color: #fff }
nav .effect.changed::after { content: ' •'; color: var(--accent) }
nav .new { display: flex; gap: 6px; padding: 10px 16px }
nav .new input { flex: 1; min-width: 0 }
main { position: relative; overflow: hidden; display: grid; grid-template-rows: 1fr auto }
#view { position: relative; overflow: hidden }
#view canvas { position: absolute; inset: 0; width: 100%; height: 100% }
#count { position: absolute; left: 12px; top: 10px; color: var(--dim); font: 12px ui-monospace, monospace }
#help { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 12.5px }
#error { position: absolute; top: 12px; left: 12px; right: 12px; font: 12px ui-monospace, monospace; color: #fff; background: #7a2a1d; padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; display: none; z-index: 3 }
#play { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 14px; background: var(--panel); border-top: 1px solid var(--line) }
#play label { color: var(--dim); font-size: 12.5px; display: flex; gap: 6px; align-items: center }
#play input[type=number] { width: 70px }
#play input[type=range] { width: 110px; accent-color: var(--accent) }
/* The inspector: one line a setting, a fixed column of names, fields that fill the rest. */
aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 8px 0 40px; font-size: 12.5px }
.layer { border-bottom: 1px solid var(--line) }
.layer.muted .top .what, .layer.muted .top .often, .layer.muted .top .index { opacity: .4 }
.layer > .top { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 6px 0 4px }
.layer:not(.shut) > .top { background: #202226 }
.top .title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 7px; cursor: pointer; white-space: nowrap; overflow: hidden }
.top .chev, .folder .chev { width: 12px; color: var(--dim); font-size: 10px; flex: none }
.top .index { color: var(--dim); font-variant-numeric: tabular-nums; flex: none }
.top .what { font-weight: 600; color: var(--text); flex: none }
.top .often { color: var(--dim); overflow: hidden; text-overflow: ellipsis }
.top .tools { display: flex; gap: 0; flex: none }
button.tool { padding: 2px 5px; height: 22px; font-size: 11.5px; border-radius: 4px; background: transparent; border-color: transparent; color: var(--dim) }
button.tool:hover { background: #2a2d33; color: var(--text) }
button.tool.on { color: var(--accent); background: #2a2520; border-color: #4a3a22 }
.layer > .body { padding: 2px 0 8px }
.layer.shut > .body { display: none }
.folder { display: flex; align-items: center; gap: 6px; width: 100%; height: 26px; margin: 0; padding: 0 12px 0 22px; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--text); font-size: 12px; font-weight: 600; text-align: left }
.folder:hover { background: #24262b }
.folder .count { margin-left: auto; color: var(--dim); font-weight: 400 }
.inner { padding: 2px 0 4px }
.row { display: grid; grid-template-columns: 120px 1fr 18px; align-items: center; gap: 8px; min-height: 26px; padding: 1px 10px 1px 22px }
.row.sub { padding-left: 36px }
.row .name { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: none }
.row .name.scrub { cursor: ew-resize }
.row.set .name { color: var(--text) }
.row.changed .name { color: var(--accent) }
.row .val { display: flex; gap: 4px; align-items: center; min-width: 0 }
.row .val.six { flex-wrap: wrap }
.row .val.six .num { flex: 0 0 calc((100% - 8px) / 3) }
.num { flex: 1 1 0; min-width: 0; display: flex; align-items: center; height: 22px; background: #131417; border: 1px solid #2a2d33; border-radius: 4px }
.num:focus-within { border-color: var(--accent) }
.num .axis { flex: none; width: 14px; text-align: center; font-size: 10.5px; font-weight: 600 }
.num .axis.x { color: #e5675f } .num .axis.y { color: #7cc46a } .num .axis.z { color: #5f9de5 }
.num input { flex: 1; min-width: 0; height: 20px; padding: 0 6px; border: 0; border-radius: 0; background: transparent; font-size: 12px; font-variant-numeric: tabular-nums }
.num input::placeholder { color: #5d626b }
.row .to { flex: none; color: var(--dim); font-size: 11px }
.row select { flex: 1; min-width: 0; height: 22px; padding: 0 6px; font-size: 12px; border-radius: 4px }
.row input[type=checkbox] { margin: 0; accent-color: var(--accent) }
.row input[type=color] { width: 30px; height: 20px; padding: 0 1px; border-radius: 3px; flex: none }
.row .hex { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums }
.row .note { color: var(--dim); font-size: 11.5px }
.row input.code { flex: 1; min-width: 0; height: 22px; padding: 0 6px; font: 11.5px ui-monospace, Menlo, monospace; border-radius: 4px }
.row .clear { padding: 0; width: 18px; height: 18px; border: 0; border-radius: 3px; background: transparent; font-size: 12px; line-height: 1; color: var(--dim) }
.row .clear:hover { background: #2a2d33; color: var(--text) }
.row:not(.set) .clear, .row.fixed .clear { visibility: hidden }
.empty { color: var(--dim); padding: 10px 12px }
.add { display: flex; gap: 8px; padding: 10px 12px }
</style>
</head>
<body>
<div class="app">
  <header>
    <b>Particle workshop</b>
    <select id="game"></select>
    <select id="file"></select>
    <span class="sp"></span>
    <span id="status"></span>
    <button id="revert">Revert</button>
    <button id="save" class="go">Save to game</button>
  </header>
  <nav id="nav"></nav>
  <main>
    <div id="view">
      <div id="count"></div>
      <div id="help">Drag to turn round it, right-drag to slide, wheel to come near. The effect is thrown from the middle of the grid; the white stick is 1.8 m, a person.</div>
      <div id="error"></div>
    </div>
    <div id="play"></div>
  </main>
  <aside id="edit"></aside>
</div>
<script type="module" src="/particles.ts"></script>
</body>
</html>
