<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI workshop</title>
<script type="importmap">
{
  "imports": {
    "three": "/three/build/three.module.js",
    "three/addons/": "/three/examples/jsm/",
    "pixi.js": "/npm/pixi.js/dist/pixi.mjs",
    "pixi.js/events": "/npm/pixi.js/dist/pixi.mjs",
    "#engine/": "/engine/",
    "#plugins/": "/plugins/",
    "#addons/": "/addons/",
    "fflate": "/npm/fflate/esm/browser.js",
    "fzstd": "/npm/fzstd/esm/index.mjs"
  }
}
</script>
<style>
:root { --bg: #111214; --panel: #1a1b1e; --card: #212327; --line: #2c2f35; --text: #e2e4e8; --dim: #8d929b; --accent: #e0a33a; --pick: #4fc3ff }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, system-ui, sans-serif }
.app { display: grid; grid-template-columns: 230px 1fr 380px; grid-template-rows: 52px 1fr; height: 100vh }
header { grid-column: 1 / 4; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line) }
header b { color: var(--accent); font-size: 15px }
header select { margin-left: 4px }
button, select, input { font: inherit; font-size: 13px; color: var(--text) }
button { padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px; background: #26292e; cursor: pointer }
button.go { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600 }
button:disabled { opacity: .35; cursor: default }
select, input { background: #121316; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px }
.sp { flex: 1 }
#status { color: var(--dim); font-size: 13px }
#status.dirty { color: var(--accent) }
nav { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 8px 0 24px }
nav .screen { padding: 14px 16px 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim) }
nav .state { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: none; padding: 8px 16px 8px 22px; color: var(--text) }
nav .state:hover { background: #24262b }
nav .state.on { background: #2b2e34; box-shadow: inset 3px 0 var(--accent); color: #fff }
main { position: relative; overflow: hidden }
#frame { position: absolute; left: 50%; top: 50%; transform-origin: center center; box-shadow: 0 0 0 1px #000, 0 16px 50px #000a; cursor: crosshair }
#back { position: absolute; inset: 0; background: #444 center / cover no-repeat }
#frame canvas { position: absolute; left: 0; top: 0 }
#marks { position: absolute; inset: 0; pointer-events: none }
#marks div { position: absolute; border: 2px solid var(--pick); border-radius: 3px; box-shadow: 0 0 0 1px #0008 }
#tip { position: absolute; left: 16px; bottom: 12px; color: var(--dim); font-size: 13px }
#error { position: absolute; top: 12px; left: 12px; right: 12px; font: 12px ui-monospace, monospace; color: #fff; background: #7a2a1d; padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; display: none; z-index: 3 }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 12px 12px 40px }
.thing { border: 1px solid var(--line); border-radius: 8px; background: var(--card); margin-bottom: 8px }
.thing > .head { padding: 10px 12px; cursor: pointer }
.thing > .head b { display: block; font-size: 14px }
.thing > .head span { color: var(--dim); font-size: 12.5px }
.thing.on { border-color: var(--pick) }
.thing > .body { display: none; padding: 2px 12px 12px; border-top: 1px solid var(--line) }
.thing.on > .body { display: block }
.part { margin-top: 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim) }
.row { display: grid; grid-template-columns: 116px 1fr; gap: 8px; align-items: center; margin: 6px 0 }
.row > label { color: var(--dim); font-size: 13px }
.row.changed > label { color: var(--accent) }
.row .val { display: flex; gap: 6px; align-items: center; min-width: 0 }
.row .val input[type=text], .row .val select { flex: 1; min-width: 0 }
.row .val input[type=number] { width: 0; flex: 1; min-width: 0 }
.row .val input[type=range] { flex: 1; accent-color: var(--accent) }
.row .val .n { width: 34px; text-align: right; color: var(--dim); font: 12px ui-monospace, monospace }
.row .val input[type=color] { width: 40px; height: 28px; padding: 1px 2px }
.word { margin: 8px 0 }
.word label { display: block; color: var(--dim); font-size: 12.5px; margin-bottom: 3px }
.word.changed label { color: var(--accent) }
.word input { width: 100% }
.empty { color: var(--dim); padding: 6px 2px }
</style>
</head>
<body>
<div class="app">
  <header>
    <b>UI workshop</b>
    <select id="game"></select>
    <span class="sp"></span>
    <span id="status"></span>
    <button id="revert">Revert</button>
    <button id="save" class="go">Save to game</button>
  </header>
  <nav id="nav"></nav>
  <main id="view">
    <div id="frame"><div id="back"></div><div id="marks"></div></div>
    <div id="tip">Click anything on the screen to change it.</div>
    <div id="error"></div>
  </main>
  <aside id="edit"></aside>
</div>
<script type="module" src="/ui.ts"></script>
</body>
</html>
