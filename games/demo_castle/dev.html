<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>demo_castle dev</title>
    <style>
      body { margin: 0; background: #0b0b0e; display: grid; place-items: center; height: 100vh }
      canvas { grid-area: 1 / 1 }
      .lil-gui.root { max-height: 100vh; overflow-y: auto }
    </style>
  </head>
  <body>
    <script type="module">
      // The testbed: index.html, entering the climb scene, or the scene `?scene=<name>` names (`main`).
      // The panel, top right, edits this tab's one copy of the climb scene's definitions
      // (`assets/climb.json`), which the climber's rule reads each step: its run, and every number of
      // its climb. The truths in this tab are on `window.__scenes` (`__scenes.get('climb').rows`), and
      // the last error a step or a frame threw on `window.__error`, shown over the page while the loop
      // goes on.
      import { boot } from '#engine/engine.ts'
      import { accept, load, manager, link, view } from '#addons/scenemanager/scenemanager.addon.ts'
      import { loopback } from '#addons/loopback/loopback.addon.ts'
      import GUI from 'lil-gui'
      import { prepared } from '#plugins/loader/loader.sim.ts'
      import { scene as theScene } from './climb.sim.ts'
      import { sim } from './demo_castle.sim.ts'
      import file from './demo_castle.scene.json'

      // The scene the address names: dev.html?scene=<scene>
      file.prefabs.scenemanager.entry = new URLSearchParams(location.search).get('scene') ?? 'climb'
      // The tab's one copy of the climb scene's definitions: every rule and look reads this object, so
      // the panel's edits reach the next step.
      const defs = await prepared(theScene.world, theScene.world.defs)

      const dt = file.prefabs.engine.dt
      const truth = boot(file, sim)
      const scenes = await load(truth, import.meta.url)
      window.__scenes = scenes
      const page = view(link(loopback(accept(manager(truth)))), file, import.meta.url, (me, scene) => {
        for (const surface of [me.plugins.render3d ?? me.plugins.render2d, me.plugins.ui]) {
          if (!surface) continue
          const canvas = document.createElement('canvas')
          canvas.width = scene.prefabs.engine.width
          canvas.height = scene.prefabs.engine.height
          document.body.appendChild(canvas)
          surface.mount(canvas)
        }
      })

      // The panel. A press on it stops there, a release does not, and the focus goes back to the page
      // after a click, so the game's keys keep working.
      const gui = new GUI({ title: 'demo_castle dev' })
      for (const type of ['keydown', 'keyup', 'click', 'mousedown', 'contextmenu', 'wheel'])
        gui.domElement.addEventListener(type, e => e.stopPropagation())
      gui.domElement.addEventListener('pointerup', () => requestAnimationFrame(() => {
        const at = document.activeElement
        if (gui.domElement.contains(at) && !(at.tagName === 'INPUT' && (at.type === 'text' || at.type === 'number'))) at.blur()
      }))
      addEventListener('change', e => { if (gui.domElement.contains(e.target)) e.target.blur() })

      const p = defs.player, c = p.climb
      const body = gui.addFolder('climber')
      body.add(p, 'run', 1, 12, 0.1).name('run (m/s)')
      const reach = gui.addFolder('reach')
      reach.add(c.reach, 'above', 0, 1.5, 0.01).name('over the head (m)')
      reach.add(c.reach, 'below', 0, 1.5, 0.01).name('under the head (m)')
      reach.add(c.reach, 'out', 0.1, 1.5, 0.01).name('out from the body (m)')
      const hang = gui.addFolder('hang')
      hang.add(c.hang, 'depth', 1, 2.5, 0.01).name('feet under the ledge (m)')
      hang.add(c.hang, 'off', 0.1, 1, 0.01).name('out from the ledge (m)')
      hang.add(c, 'shimmy', 0.2, 4, 0.05).name('shimmy (m/s)')
      hang.add(c.join, 'gap', 0, 1, 0.01).name('join gap (m)')
      hang.add(c.join, 'rise', 0, 1, 0.01).name('join rise (m)')
      const pull = gui.addFolder('pull up')
      pull.add(c.pull, 'time', 0.1, 2, 0.01).name('time (s)')
      pull.add(c.pull, 'in', 0.1, 1.5, 0.01).name('in from the edge (m)')
      const leap = gui.addFolder('leap')
      leap.add(c.leap.back, 0, 0, 10, 0.1).name('back out (m/s)')
      leap.add(c.leap.back, 1, 0, 10, 0.1).name('back up (m/s)')
      leap.add(c.leap.side, 0, 0, 10, 0.1).name('side along (m/s)')
      leap.add(c.leap.side, 1, 0, 10, 0.1).name('side up (m/s)')
      leap.add(c.leap, 'up', 0, 10, 0.1).name('up (m/s)')
      leap.add(c, 'cool', 0, 1, 0.01).name('regrab after (s)')

      // Every error a step or a frame throws, over the page and on window.__error; the loop goes on.
      const shown = document.createElement('pre')
      shown.style.cssText = 'position:fixed;left:8px;top:8px;margin:0;color:#ff8a80;font:12px monospace;white-space:pre-wrap;max-width:90vw;z-index:9'
      document.body.appendChild(shown)

      let last = performance.now(), owed = 0
      const loop = async now => {
        owed += Math.min((now - last) / 1000, 0.25)
        last = now
        try {
          page.input()
          while (owed >= dt) { truth.step(dt); owed -= dt }
          await page.frame(owed / dt)
        } catch (e) { window.__error = e; shown.textContent = String(e?.stack ?? e); owed = 0 }
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)
    </script>
  </body>
</html>
