<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>clip analyzer</title>
    <style>
      :root { --bg: #0d0f13; --panel: #161a21; --line: #2a303b; --text: #d7dce4; --dim: #8a93a3; --accent: #6fb3ff }
      * { box-sizing: border-box }
      body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; height: 100vh; display: grid; grid-template-columns: 340px 1fr; grid-template-rows: 1fr 260px }
      #side { grid-row: 1 / 3; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px }
      #view { position: relative; min-height: 0 }
      #view canvas { display: block; width: 100%; height: 100% }
      #timeline { border-top: 1px solid var(--line); background: #0a0c10; min-height: 0 }
      #timeline canvas { display: block; width: 100%; height: 100%; cursor: ew-resize }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 16px 0 6px }
      h2:first-child { margin-top: 0 }
      label { display: block; color: var(--dim); margin: 6px 0 2px }
      select, input[type=text], input[type=number], button { width: 100%; background: #0f1218; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 6px; font: inherit }
      button { cursor: pointer; margin-top: 6px }
      button:hover { border-color: var(--accent) }
      .row { display: flex; gap: 6px; align-items: center }
      .row > * { flex: 1 }
      .check { display: flex; gap: 6px; align-items: center; color: var(--text); margin: 6px 0 }
      .check input { width: auto }
      #troupe { height: 160px }
      pre { background: #0f1218; border: 1px solid var(--line); border-radius: 4px; padding: 8px; margin: 6px 0; white-space: pre-wrap; font: 12px/1.45 ui-monospace, monospace; color: var(--text) }
      #status { color: var(--dim); min-height: 1.4em }
      #status.error { color: #ff8a80 }
      #legend { position: absolute; left: 10px; bottom: 10px; background: rgba(13, 15, 19, .85); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: 12px/1.5 ui-monospace, monospace }
      #legend span { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px }
    </style>
  </head>
  <body>
    <div id="side">
      <h2>Clip</h2>
      <label for="rig">The rig and body</label>
      <select id="rig"></select>
      <label for="clip">Its clip</label>
      <select id="clip"></select>
      <h2>Play</h2>
      <button id="play">Pause</button>
      <label for="speed">Speed, times its own</label>
      <input id="speed" type="number" value="1" step="0.25" min="0.05" />
      <label class="check"><input id="carry" type="checkbox" checked /> Carried as anim carries it (off: held in place at the start)</label>
      <label class="check"><input id="loop" type="checkbox" checked /> Play it again from the start when it ends</label>
      <h2>The spot and its offsets, as the rig has them</h2>
      <pre id="offsets"></pre>
      <h2>What the bake measured</h2>
      <pre id="measures"></pre>
      <h2>A clip from the troupe collection</h2>
      <label for="find">Find a clip by its name or pack</label>
      <input id="find" type="text" placeholder="wall run, cover, roll ..." />
      <select id="troupe" size="8"></select>
      <button id="bake">Bake it onto this body</button>
      <div id="status"></div>
    </div>
    <div id="view"><div id="legend"></div></div>
    <div id="timeline"></div>
    <script type="module" src="./clipanalyzer.page.ts"></script>
  </body>
</html>
